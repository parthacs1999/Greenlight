[project]
name = "greenlight"
version = "0.1.0"
description = "A bring-your-own-key, multi-provider AI agent that fixes failing tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "google-genai>=2.0",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "keyring>=25",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "streamlit>=1.50"]

[project.scripts]
greenlight = "greenlight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["evals/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Mostly user-facing copy and HTML snippets.
"src/greenlight/streamlit_app.py" = ["E501"]
